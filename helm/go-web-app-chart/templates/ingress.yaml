
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rithish-co-in
spec:
  ingressClassName: nginx
  rules:
    - host: www.rithish.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-web-app
                port:
                  number: 80


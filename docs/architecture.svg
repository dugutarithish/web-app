<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">AWS EKS Go Web App animated architecture</title>
<desc id="desc">Animated traffic flows from the browser through Route 53, a load balancer and NGINX ingress to a Kubernetes service and Go application pods in private subnets. A bastion host provides restricted administrative access. GitHub Actions, Docker Hub, Helm and Argo CD form the delivery pipeline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#13243a"/></linearGradient>
  <linearGradient id="public" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142d49"/><stop offset="1" stop-color="#102039"/></linearGradient>
  <linearGradient id="private" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10332f"/><stop offset="1" stop-color="#102922"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52d7f5"/></marker>
  <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ffb454"/></marker>
  <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#49d6a0"/></marker>
  <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b7a0ff"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf4ff}
    .muted{fill:#a9bbd2}.title{font-size:34px;font-weight:750;letter-spacing:1px}.subtitle{font-size:16px}
    .label{font-size:17px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px}
    .node{stroke-width:2;rx:16}.route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .flow{fill:#f8fdff;stroke-width:3;filter:url(#glow)}
    .pipeline{font-size:15px;font-weight:700}
  </style>
</defs>
<rect width="1400" height="900" rx="24" fill="url(#bg)"/>
<g opacity=".18" stroke="#37506d" stroke-width="1"><path d="M0 50H1400 M0 100H1400 M0 150H1400 M0 200H1400 M0 250H1400 M0 300H1400 M0 350H1400 M0 400H1400 M0 450H1400 M0 500H1400 M0 550H1400 M0 600H1400 M0 650H1400 M0 700H1400 M0 750H1400 M0 800H1400 M0 850H1400"/><path d="M50 0V900 M100 0V900 M150 0V900 M200 0V900 M250 0V900 M300 0V900 M350 0V900 M400 0V900 M450 0V900 M500 0V900 M550 0V900 M600 0V900 M650 0V900 M700 0V900 M750 0V900 M800 0V900 M850 0V900 M900 0V900 M950 0V900 M1000 0V900 M1050 0V900 M1100 0V900 M1150 0V900 M1200 0V900 M1250 0V900 M1300 0V900 M1350 0V900"/></g>
<text x="700" y="52" text-anchor="middle" class="title">AWS EKS • GO WEB APP</text>
<text x="700" y="82" text-anchor="middle" class="subtitle muted">Animated deployment architecture | CI/CD + Kubernetes + GitOps</text>

<!-- Browser and DNS -->
<rect x="35" y="145" width="190" height="94" class="node" fill="#14243a" stroke="#75a7ff"/>
<text x="130" y="178" text-anchor="middle" class="label">USER / BROWSER</text><text x="130" y="207" text-anchor="middle" class="small muted">HTTP(S) request</text>
<rect x="285" y="145" width="200" height="94" class="node" fill="#2b271f" stroke="#ffb454"/>
<text x="385" y="178" text-anchor="middle" class="label">AMAZON ROUTE 53</text><text x="385" y="207" text-anchor="middle" class="small muted">DNS: rithish.co.in</text>
<path d="M225 192 H285" class="route" stroke="#75a7ff" marker-end="url(#arrowCyan)"/>
<circle r="6" class="flow" stroke="#75a7ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M225 192 H285"/></circle>
<text x="255" y="177" text-anchor="middle" class="tiny muted">DNS</text>

<!-- VPC -->
<rect x="520" y="120" width="845" height="575" rx="24" fill="#0c1828" stroke="#4a6384" stroke-width="3"/>
<text x="548" y="151" font-size="22" font-weight="750">AWS VPC</text>
<rect x="545" y="175" width="270" height="485" rx="18" fill="url(#public)" stroke="#75a7ff" stroke-width="2"/>
<text x="565" y="205" font-size="18" font-weight="750" fill="#75a7ff">PUBLIC SUBNETS</text>
<rect x="840" y="175" width="500" height="485" rx="18" fill="url(#private)" stroke="#49d6a0" stroke-width="2"/>
<text x="860" y="205" font-size="18" font-weight="750" fill="#49d6a0">PRIVATE SUBNETS</text>

<!-- Public network nodes -->
<rect x="565" y="245" width="230" height="78" class="node" fill="#17364b" stroke="#52d7f5"/>
<text x="680" y="274" text-anchor="middle" class="label">LOAD BALANCER</text><text x="680" y="300" text-anchor="middle" class="small muted">AWS LB / Ingress entry</text>
<rect x="565" y="365" width="230" height="82" class="node" fill="#17364b" stroke="#52d7f5"/>
<text x="680" y="395" text-anchor="middle" class="label">NGINX INGRESS</text><text x="680" y="422" text-anchor="middle" class="small muted">Host + path routing</text>
<rect x="565" y="510" width="230" height="95" class="node" fill="#33291d" stroke="#ffb454"/>
<text x="680" y="540" text-anchor="middle" class="label">BASTION HOST</text><text x="680" y="566" text-anchor="middle" class="small muted">Restricted admin access</text><text x="680" y="587" text-anchor="middle" class="tiny muted">SSH / kubectl</text>

<!-- Private EKS -->
<rect x="865" y="235" width="450" height="380" rx="20" fill="#102d32" stroke="#2d8b80" stroke-width="2"/>
<text x="890" y="267" font-size="21" font-weight="750">AMAZON EKS CLUSTER</text>
<rect x="895" y="300" width="390" height="65" class="node" fill="#16434a" stroke="#49d6a0"/>
<text x="1090" y="326" text-anchor="middle" class="label">KUBERNETES SERVICE</text><text x="1090" y="348" text-anchor="middle" class="tiny muted">Stable internal endpoint</text>
<rect x="895" y="405" width="390" height="78" class="node" fill="#173a46" stroke="#52d7f5"/>
<text x="1090" y="434" text-anchor="middle" class="label">GO WEB APP DEPLOYMENT</text><text x="1090" y="460" text-anchor="middle" class="small muted">Pod replicas • container image</text>
<rect x="895" y="520" width="390" height="65" class="node" fill="#2a2548" stroke="#b7a0ff"/>
<text x="1090" y="547" text-anchor="middle" class="label">GO APP PODS</text><text x="1090" y="569" text-anchor="middle" class="small muted">Application listens on port 8080</text>

<!-- Request arrows -->
<path d="M485 192 H520 V284 H565" class="route" stroke="#ffb454" marker-end="url(#arrowOrange)"/>
<circle r="6" class="flow" stroke="#ffb454"><animateMotion dur="3s" repeatCount="indefinite" path="M485 192 H520 V284 H565"/></circle>
<path d="M680 323 V365" class="route" stroke="#52d7f5" marker-end="url(#arrowCyan)"/>
<circle r="6" class="flow" stroke="#52d7f5"><animateMotion dur="1.3s" repeatCount="indefinite" path="M680 323 V365"/></circle>
<path d="M795 405 H825 V332 H895" class="route" stroke="#52d7f5" marker-end="url(#arrowCyan)"/>
<circle r="6" class="flow" stroke="#52d7f5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M795 405 H825 V332 H895"/></circle>
<path d="M1090 365 V405" class="route" stroke="#49d6a0" marker-end="url(#arrowGreen)"/>
<circle r="6" class="flow" stroke="#49d6a0"><animateMotion dur="1.4s" repeatCount="indefinite" path="M1090 365 V405"/></circle>
<path d="M1090 483 V520" class="route" stroke="#b7a0ff" marker-end="url(#arrowPurple)"/>
<circle r="6" class="flow" stroke="#b7a0ff"><animateMotion dur="1.5s" repeatCount="indefinite" path="M1090 483 V520"/></circle>
<path d="M795 560 H830 V635 H865" class="route" stroke="#ffb454" marker-end="url(#arrowOrange)"/>
<circle r="6" class="flow" stroke="#ffb454"><animateMotion dur="2.8s" repeatCount="indefinite" path="M795 560 H830 V635 H865"/></circle>

<text x="35" y="650" class="small muted">Traffic: Browser → DNS → Load Balancer → NGINX → Service → Pods</text>
<text x="35" y="674" class="small" fill="#ffb454">Admin: Bastion → private cluster access (restricted)</text>

<!-- Delivery pipeline -->
<rect x="35" y="725" width="1330" height="135" rx="20" fill="#111c2f" stroke="#33445f" stroke-width="2"/>
<text x="60" y="755" font-size="19" font-weight="750">CI/CD + GITOPS DELIVERY PIPELINE</text>
<g>
  <rect x="70" y="780" width="205" height="55" rx="12" fill="#17263a" stroke="#75a7ff" stroke-width="2"/><text x="172" y="803" text-anchor="middle" class="pipeline">GitHub</text><text x="172" y="823" text-anchor="middle" class="tiny muted">Source code</text>
  <rect x="325" y="780" width="220" height="55" rx="12" fill="#17263a" stroke="#52d7f5" stroke-width="2"/><text x="435" y="803" text-anchor="middle" class="pipeline">GitHub Actions</text><text x="435" y="823" text-anchor="middle" class="tiny muted">Build • test • publish</text>
  <rect x="595" y="780" width="190" height="55" rx="12" fill="#17263a" stroke="#ffb454" stroke-width="2"/><text x="690" y="803" text-anchor="middle" class="pipeline">Docker Hub</text><text x="690" y="823" text-anchor="middle" class="tiny muted">Container image</text>
  <rect x="835" y="780" width="210" height="55" rx="12" fill="#17263a" stroke="#b7a0ff" stroke-width="2"/><text x="940" y="803" text-anchor="middle" class="pipeline">Helm + Git</text><text x="940" y="823" text-anchor="middle" class="tiny muted">Desired configuration</text>
  <rect x="1095" y="780" width="220" height="55" rx="12" fill="#17263a" stroke="#49d6a0" stroke-width="2"/><text x="1205" y="803" text-anchor="middle" class="pipeline">Argo CD</text><text x="1205" y="823" text-anchor="middle" class="tiny muted">Sync • health status</text>
  <path d="M275 807 H325 M545 807 H595 M785 807 H835 M1045 807 H1095" class="route" stroke="#7892b3" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <circle r="5" fill="#f8fdff" stroke="#52d7f5" stroke-width="2"><animateMotion dur="2s" repeatCount="indefinite" path="M275 807 H325"/></circle>
  <circle r="5" fill="#f8fdff" stroke="#52d7f5" stroke-width="2"><animateMotion dur="2.5s" repeatCount="indefinite" path="M545 807 H595"/></circle>
  <circle r="5" fill="#f8fdff" stroke="#ffb454" stroke-width="2"><animateMotion dur="2.3s" repeatCount="indefinite" path="M785 807 H835"/></circle>
  <circle r="5" fill="#f8fdff" stroke="#49d6a0" stroke-width="2"><animateMotion dur="2.1s" repeatCount="indefinite" path="M1045 807 H1095"/></circle>
</g>
</svg>
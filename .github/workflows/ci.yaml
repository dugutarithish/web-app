```yaml
name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "helm/**"
      - "k8s/**"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-web-app/go.mod

      - name: Build
        working-directory: go-web-app
        run: go build -o go-web-app .

      - name: Test
        working-directory: go-web-app
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-web-app/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: go-web-app

  push:
    runs-on: ubuntu-latest
    needs: [build, code-quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./go-web-app
          file: ./go-web-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push
    permissions:
      contents: write

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Update tag in Helm chart
        env:
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config user.email "dugutarithishkumar@gmail.com"
          git config user.name "dugutarithish"

          git add helm/go-web-app-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm chart changes to commit."
            exit 0
          fi

          git commit -m "Update tag in Helm chart [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
```
